name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Name APK for publishing
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Heyogesh_Drive.apk
      - name: Upload Heyogesh Drive APK
        uses: actions/upload-artifact@v4
        with:
          name: Heyogesh_Drive
          path: Heyogesh_Drive.apk
          if-no-files-found: error
          retention-days: 30
