<!DOCTYPE html>
<html lang="en" class="is-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020305">
  <meta name="color-scheme" content="dark">
  <title>HEYOGESH — Cinema</title>
  <style>
    /*
      The iframe is the playback surface. These global rules prevent the host page
      from ever creating a scroll bar, gutter, or layout box around it.
    */
    :root {
      --ink: #020305;
      --ice: #f4fbff;
      --cyan: #56e4ff;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--ink);
    }

    body {
      position: fixed;
      inset: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /*
      Cascade from legacy visual-viewport fallback through modern viewport units.
      Browsers use the last unit they understand; dvh tracks browser chrome live.
    */
    .mega-player {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: var(--legacy-viewport-height, 100vh);
      height: 100vh;
      height: 100svh;
      height: 100lvh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      border: 0;
      background: #000;
      opacity: 0;
      transform: translateZ(0);
      transition: opacity 560ms cubic-bezier(.2, .75, .2, 1);
      will-change: opacity;
    }

    .player-ready .mega-player {
      opacity: 1;
    }

    /* Loading is an overlay, not a page layout. */
    .loading-screen {
      position: fixed;
      z-index: 3;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(41, 127, 160, .17), transparent 28rem),
        radial-gradient(circle at 78% 92%, rgba(41, 221, 255, .08), transparent 30rem),
        #020305;
      color: var(--ice);
      opacity: 1;
      visibility: visible;
      transition: opacity 600ms cubic-bezier(.2, .75, .2, 1), visibility 0s linear 600ms;
      contain: layout paint style;
    }

    .loading-screen::before {
      position: absolute;
      inset: -30%;
      content: "";
      background: linear-gradient(108deg, transparent 44%, rgba(99, 227, 255, .07) 50%, transparent 56%);
      transform: translate3d(-22%, 0, 0) rotate(-10deg);
      animation: scan 5.8s ease-in-out infinite;
      pointer-events: none;
    }

    .player-ready .loading-screen {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-mark {
      position: relative;
      display: grid;
      justify-items: center;
      gap: 1.15rem;
      padding: 2rem;
      text-align: center;
      transform: translateZ(0);
    }

    .aperture {
      position: relative;
      width: 4.5rem;
      aspect-ratio: 1;
      border: 1px solid rgba(191, 243, 255, .42);
      border-radius: 50%;
      box-shadow: 0 0 0 1rem rgba(75, 216, 255, .025), 0 0 3.7rem rgba(63, 217, 255, .16), inset 0 0 1.4rem rgba(89, 221, 255, .13);
      transform: translateZ(0);
      animation: breathe 2.8s ease-in-out infinite;
    }

    .aperture::before,
    .aperture::after {
      position: absolute;
      inset: .75rem;
      border: 1px solid rgba(226, 252, 255, .75);
      border-radius: 50%;
      content: "";
    }

    .aperture::before {
      border-right-color: transparent;
      border-bottom-color: transparent;
      animation: orbit 1.65s linear infinite;
    }

    .aperture::after {
      inset: 1.42rem;
      border: 0;
      background: #e8fbff;
      box-shadow: 0 0 1rem .18rem rgba(95, 228, 255, .7);
    }

    .loading-wordmark {
      margin: 0;
      color: rgba(244, 251, 255, .97);
      font-family: "Arial Narrow", "Roboto Condensed", ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(.8rem, 1.55vw, 1rem);
      font-stretch: condensed;
      font-weight: 700;
      letter-spacing: .48em;
      line-height: 1;
      text-indent: .48em;
    }

    .loading-status {
      min-height: 1.25rem;
      margin: 0;
      color: rgba(211, 237, 244, .62);
      font: 500 clamp(.64rem, 1.3vw, .76rem)/1.5 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    /* The only persistent host control: a real fullscreen/orientation request. */
    .cinema-control {
      position: fixed;
      z-index: 4;
      top: max(.75rem, calc(var(--safe-top) + .48rem));
      right: max(.75rem, calc(var(--safe-right) + .48rem));
      display: inline-grid;
      place-items: center;
      width: 2.65rem;
      height: 2.65rem;
      padding: 0;
      border: 1px solid rgba(222, 250, 255, .26);
      border-radius: .78rem;
      background: rgba(4, 13, 18, .54);
      box-shadow: 0 .35rem 1.7rem rgba(0, 0, 0, .27), inset 0 1px rgba(255, 255, 255, .12);
      color: rgba(237, 251, 255, .92);
      cursor: pointer;
      opacity: .38;
      backdrop-filter: blur(14px) saturate(130%);
      -webkit-backdrop-filter: blur(14px) saturate(130%);
      transform: translateZ(0);
      transition: opacity 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .cinema-control:hover,
    .cinema-control:focus-visible {
      background: rgba(9, 37, 48, .82);
      opacity: 1;
      outline: none;
      transform: translateZ(0) scale(1.06);
    }

    .cinema-control:focus-visible {
      box-shadow: 0 0 0 3px rgba(86, 228, 255, .5), 0 .35rem 1.7rem rgba(0, 0, 0, .27);
    }

    .cinema-control svg {
      width: 1.08rem;
      height: 1.08rem;
      fill: none;
      stroke: currentColor;
      stroke-linecap: square;
      stroke-width: 1.6;
    }

    /* A quiet, non-interactive in-player service mark. */
    .watermark {
      position: fixed;
      z-index: 2;
      bottom: max(.86rem, calc(var(--safe-bottom) + .55rem));
      left: max(.86rem, calc(var(--safe-left) + .55rem));
      display: inline-flex;
      align-items: center;
      min-height: 2.25rem;
      padding: .1rem .19rem .1rem .72rem;
      overflow: hidden;
      border: 1px solid rgba(221, 249, 255, .26);
      border-radius: .58rem;
      background: linear-gradient(112deg, rgba(246, 254, 255, .16), rgba(14, 46, 57, .45) 36%, rgba(2, 7, 10, .55) 73%);
      box-shadow: 0 .45rem 1.6rem rgba(0, 0, 0, .35), inset 0 1px rgba(255, 255, 255, .17), 0 0 1.2rem rgba(58, 210, 242, .13);
      color: #f2fcff;
      font-family: "Arial Narrow", "Roboto Condensed", ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(.58rem, 1.8vw, .78rem);
      font-stretch: condensed;
      font-weight: 800;
      letter-spacing: .23em;
      line-height: 1;
      pointer-events: none;
      text-indent: .23em;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .7), 0 0 .72rem rgba(107, 231, 255, .72);
      transform: translate3d(0, 0, 0);
      will-change: transform, box-shadow;
      animation: watermark-float 6.2s ease-in-out infinite, watermark-pulse 6.2s ease-in-out infinite;
    }

    .watermark::before {
      position: absolute;
      inset: 0 auto 0 -56%;
      width: 45%;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .42), transparent);
      transform: skewX(-22deg) translate3d(0, 0, 0);
      animation: reflection 6.2s ease-in-out infinite;
    }

    .watermark::after {
      width: .36rem;
      height: .36rem;
      margin-left: .55rem;
      border-radius: 50%;
      content: "";
      background: #88efff;
      box-shadow: 0 0 .55rem .1rem rgba(87, 229, 255, .75);
    }

    @keyframes orbit {
      to { transform: rotate(360deg); }
    }

    @keyframes breathe {
      50% { transform: translateZ(0) scale(1.055); box-shadow: 0 0 0 1rem rgba(75, 216, 255, .025), 0 0 4.7rem rgba(63, 217, 255, .26), inset 0 0 1.4rem rgba(89, 221, 255, .18); }
    }

    @keyframes scan {
      50% { transform: translate3d(22%, 0, 0) rotate(-10deg); }
    }

    @keyframes watermark-float {
      50% { transform: translate3d(0, -.18rem, 0); }
    }

    @keyframes watermark-pulse {
      45%, 58% { box-shadow: 0 .45rem 1.6rem rgba(0, 0, 0, .35), inset 0 1px rgba(255, 255, 255, .17), 0 0 1.85rem rgba(58, 210, 242, .36); }
    }

    @keyframes reflection {
      34%, 100% { transform: skewX(-22deg) translate3d(480%, 0, 0); }
    }

    @media (max-width: 360px), (max-height: 360px) {
      .watermark {
        min-height: 1.92rem;
        padding-left: .54rem;
        letter-spacing: .17em;
        text-indent: .17em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main aria-label="HEYOGESH streaming player">
    <iframe
      id="mega-player"
      class="mega-player"
      title="HEYOGESH video player"
      src="https://mega.nz/embed/NXEVmTwB#IQTj6KBJBvdOfqpkA5nNPilGdiKmpWpMYxMMZHvm8yA"
      allow="autoplay; fullscreen"
      allowfullscreen
      loading="eager"></iframe>

    <section id="loading-screen" class="loading-screen" aria-live="polite" aria-label="Loading video player">
      <div class="loading-mark">
        <div class="aperture" aria-hidden="true"></div>
        <p class="loading-wordmark">HEYOGESH</p>
        <p id="loading-status" class="loading-status">Preparing cinema</p>
      </div>
    </section>

    <button id="cinema-control" class="cinema-control" type="button" aria-label="Enter fullscreen and lock landscape when supported" title="Cinematic mode">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"></path>
      </svg>
    </button>

    <div class="watermark" aria-hidden="true">HEYOGESH</div>
    <span id="accessibility-status" class="visually-hidden" aria-live="polite"></span>
  </main>

  <script>
    (() => {
      'use strict';

      const root = document.documentElement;
      const player = document.getElementById('mega-player');
      const loadingScreen = document.getElementById('loading-screen');
      const loadingStatus = document.getElementById('loading-status');
      const cinemaControl = document.getElementById('cinema-control');
      const accessibilityStatus = document.getElementById('accessibility-status');
      let revealed = false;
      let viewportFrame = 0;

      /**
       * Modern browsers follow 100dvh directly. This only supplies an exact visual
       * viewport height for older engines that do not implement dynamic units.
       */
      const supportsDynamicViewport = CSS.supports('height', '100dvh');
      const updateLegacyViewport = () => {
        viewportFrame = 0;
        if (supportsDynamicViewport) return;
        const visualViewport = window.visualViewport;
        const height = visualViewport ? visualViewport.height : window.innerHeight;
        root.style.setProperty('--legacy-viewport-height', `${Math.round(height)}px`);
      };

      const scheduleViewportUpdate = () => {
        if (!supportsDynamicViewport && !viewportFrame) {
          viewportFrame = requestAnimationFrame(updateLegacyViewport);
        }
      };

      updateLegacyViewport();
      window.addEventListener('resize', scheduleViewportUpdate, { passive: true });
      window.addEventListener('orientationchange', scheduleViewportUpdate, { passive: true });
      window.visualViewport?.addEventListener('resize', scheduleViewportUpdate, { passive: true });

      /**
       * Cross-origin iframes do not expose their internal video readiness. The iframe
       * load event means MEGA's embedded document is available, not that a stream is
       * buffered. A short failsafe avoids trapping the viewer behind a host overlay.
       */
      const revealPlayer = () => {
        if (revealed) return;
        revealed = true;
        requestAnimationFrame(() => root.classList.replace('is-loading', 'player-ready'));
        window.setTimeout(() => loadingScreen.setAttribute('aria-hidden', 'true'), 650);
      };

      player.addEventListener('load', revealPlayer, { once: true });
      window.setTimeout(revealPlayer, 8000);

      const announce = (message) => {
        accessibilityStatus.textContent = message;
        loadingStatus.textContent = message;
      };

      const lockLandscape = async () => {
        const orientation = screen.orientation;
        if (!orientation?.lock) return false;

        try {
          await orientation.lock('landscape');
          return true;
        } catch (error) {
          // iOS and many desktop browsers intentionally do not permit this API.
          return false;
        }
      };

      const requestCinematicMode = async () => {
        let enteredFullscreen = Boolean(document.fullscreenElement);

        if (enteredFullscreen) {
          try {
            await document.exitFullscreen();
            announce('Fullscreen exited');
          } catch (error) {
            announce('Unable to exit fullscreen in this browser');
          }
          return;
        }

        if (!enteredFullscreen) {
          const fullscreenTarget = document.documentElement;
          try {
            await fullscreenTarget.requestFullscreen({ navigationUI: 'hide' });
            enteredFullscreen = true;
          } catch (error) {
            try {
              await fullscreenTarget.requestFullscreen();
              enteredFullscreen = true;
            } catch (fallbackError) {
              enteredFullscreen = false;
            }
          }
        }

        const locked = await lockLandscape();
        if (enteredFullscreen && locked) {
          announce('Fullscreen landscape enabled');
        } else if (enteredFullscreen) {
          announce('Fullscreen enabled. Rotate your device for landscape.');
        } else if (locked) {
          announce('Landscape lock enabled');
        } else {
          announce('Cinematic mode needs browser permission. Rotate for landscape.');
        }
      };

      cinemaControl.addEventListener('click', requestCinematicMode);

      document.addEventListener('fullscreenchange', () => {
        const isFullscreen = Boolean(document.fullscreenElement);
        cinemaControl.setAttribute('aria-label', isFullscreen ? 'Exit fullscreen' : 'Enter fullscreen and lock landscape when supported');
        if (isFullscreen) {
          lockLandscape();
        } else {
          screen.orientation?.unlock?.();
        }
      });
    })();
  </script>
</body>
</html>
